<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDU専用動画プレイヤー</title>

<style>
body { font-family: sans-serif; background: #1a1a1a; color: #ffffff; text-align: center; padding: 40px 15px; }
h1 { color: #4caf50; } /* 教育用（EDU）をイメージして緑に変更 */
.hint { color: #aaaaaa; font-size: 14px; margin-bottom: 20px; }
input { padding: 14px; font-size: 16px; border: 1px solid #444; border-radius: 8px; margin: 5px; width: 80%; max-width: 400px; background: #2a2a2a; color: #fff; }
button { padding: 14px 22px; font-size: 16px; border: none; border-radius: 8px; background: #4caf50; color: white; cursor: pointer; font-weight: bold; }
#site { display: none; }
#login { margin-top: 100px; }
.video-container { margin-top: 30px; display: none; justify-content: center; }
iframe { width: 100%; max-width: 560px; aspect-ratio: 16 / 9; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
</style>
</head>

<body>

<!-- パスワード画面 -->
<div id="login">
  <h1>🔒 パスワード</h1>
  <input type="password" id="password" placeholder="パスワードを入力" onkeydown="if(event.key === 'Enter') login()">
  <button onclick="login()">入る</button>
  <p id="error"></p>
</div>

<!-- ログイン後のサイト -->
<div id="site">
  <h1>🎓 YouTube EDU 再生プレイヤー</h1>
  <p class="hint">動画のURL、または動画ID（英数字）を貼り付けてください</p>
  
  <input type="text" id="videoUrl" placeholder="例: https://youtu.be などを貼り付け" onkeydown="if(event.key === 'Enter') playVideo()">
  <button onclick="playVideo()">動画を再生</button>

  <!-- 動画が表示されるエリア -->
  <div id="videoContainer" class="video-container"></div>
</div>

<script>
const PASSWORD = "1234";

function login() {
  const input = document.getElementById("password").value;

  if (input === PASSWORD) {
    document.getElementById("login").style.display = "none";
    document.getElementById("site").style.display = "block";
    document.getElementById("videoUrl").focus();
  } else {
    document.getElementById("error").textContent = "パスワードが違います";
    document.getElementById("error").style.color = "red";
  }
}

function playVideo() {
  const input = document.getElementById("videoUrl").value.trim();
  if (!input) {
    alert("URLまたは動画IDを入力してください");
    return;
  }

  let videoId = input;

  // 貼り付けられたURLから動画ID（11桁の英数字）を自動で抽出する
  if (input.includes("youtube.com") || input.includes("youtu.be")) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = input.match(regExp);
    if (match && match[2].length === 11) {
      videoId = match[2];
    } else {
      alert("正しいYouTubeのURLを入力してください");
      return;
    }
  }

  // 教育用の「youtubeeducation.com」ドメインを適用
  // 学校ごとのフィルターが設定されているケースに対応できるよう「edufilter」パラメータも付与
  const container = document.getElementById("videoContainer");
  container.innerHTML = `
    <iframe src="https://youtubeeducation.com{videoId}?autoplay=1&edufilter=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>`;
  
  container.style.display = "flex";
}
</script>

</body>
</html>
