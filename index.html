<body style="background:#121212;color:#fff;text-align:center;padding:20px;font-family:sans-serif;">
  <h2>Private Search & Player</h2>
  <div style="margin-bottom:20px;">
    <input id="q" placeholder="キーワード検索" style="padding:12px;width:60%;font-size:16px;border-radius:6px;border:none">
    <button onclick="s()" style="padding:12px 20px;background:#00bcd4;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:bold">検索</button>
  </div>
  <div>
    <input id="u" placeholder="動画のURLをペースト" style="padding:12px;width:60%;font-size:16px;border-radius:6px;border:none">
    <button onclick="p()" style="padding:12px 20px;background:#ff0000;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:bold">再生</button>
  </div>
  <div id="v" style="margin-top:20px;position:relative;padding-bottom:56.25%"></div>
  <script>
    function s(){let q=document.getElementById('q').value;if(q){window.open(`https://duckduckgo.com{encodeURIComponent(q)}+site%3Ayoutube.com&iax=videos&ia=videos`,'_blank')}}
    function p(){let u=document.getElementById('u').value;let id=u.match(/(?:v=|\/)([\w-]{11})/);if(id){document.getElementById('v').innerHTML=`<iframe src="https://youtube.com{id}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe>`}else{alert('URLが正しくありません')}}
  </script>
</body>
