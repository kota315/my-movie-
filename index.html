<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube検索</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px 15px;
    }

    h1 {
      color: #ff0000;
    }

    input {
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 5px;
    }

    button {
      padding: 14px 22px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #ff0000;
      color: white;
      cursor: pointer;
    }

    #site {
      display: none;
    }

    #login {
      margin-top: 100px;
    }
  </style>
</head>

<body>

  <!-- パスワード画面 -->
  <div id="login">
    <h1>🔒 パスワード</h1>

    <input
      type="password"
      id="password"
      placeholder="パスワードを入力"
    >

    <button onclick="login()">入る</button>

    <p id="error"></p>
  </div>


  <!-- ログイン後のサイト -->
  <div id="site">

    <h1>🔎 YouTube検索</h1>

    <input
      type="text"
      id="search"
      placeholder="検索したい動画を入力"
      onkeydown="if(event.key === 'Enter') searchYouTube()"
    >

    <button onclick="searchYouTube()">検索</button>

  </div>


  <script>

    // ここを好きなパスワードに変更
    const PASSWORD = "1234";

    function login() {
      const input = document.getElementById("password").value;

      if (input === PASSWORD) {
        document.getElementById("login").style.display = "none";
        document.getElementById("site").style.display = "block";
      } else {
        document.getElementById("error").textContent =
          "パスワードが違います";
        document.getElementById("error").style.color = "red";
      }
    }

    function searchYouTube() {
      const keyword =
        document.getElementById("search").value.trim();

      if (!keyword) {
        alert("検索ワードを入力してください");
        return;
      }

      const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(keyword);

      window.location.href = url;
    }

  </script>

</body>
</html>
