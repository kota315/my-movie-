<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Data Portal</title>
    <style>
        body {
            font-family: sans-serif;
            background: #ffffff;
            color: #333333;
            text-align: center;
            padding: 40px 15px;
        }
        h1 {
            color: #2b579a;
            font-size: 22px;
            font-weight: normal;
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 280px;
            max-width: 80%;
            border: 1px solid #ababab;
            border-radius: 4px;
            margin: 5px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background: #2b579a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #site, #videoContainer {
            display: none;
        }
        #login {
            margin-top: 100px;
        }
        #error {
            color: red;
        }
        /* 動画プレイヤーの枠をスッキリ表示 */
        .video-box {
            margin-top: 20px;
            position: relative;
            padding-bottom: 56.25%; /* 16:9 の比率 */
            height: 0;
            overflow: hidden;
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .desc {
            font-size: 12px;
            color: #777;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- パスワード画面 -->
    <div id="login">
        <h1>🔒 認証システム</h1>
        <input type="password" id="password" placeholder="パスコードを入力" onkeydown="if(event.key === 'Enter') login()">
        <button onclick="login()">送信</button>
        <p id="error"></p>
    </div>

    <!-- ログイン後のサイト -->
    <div id="site">
        <h1>🔎 データ検索ポータル</h1>
        <p class="desc">見たい動画のURL（例: https://youtu.be）または「動画ID」を入力してください。</p>
        <input type="text" id="videoUrl" placeholder="YouTubeのURLを入力" onkeydown="if(event.key === 'Enter') loadVideo()">
        <button onclick="loadVideo()">動画を読み込む</button>
        
        <!-- 動画が表示されるエリア -->
        <div id="videoContainer" class="video-box">
            <iframe id="player" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const PASSWORD = "1234";

        function login() {
            const input = document.getElementById("password").value;
            if (input === PASSWORD) {
                document.getElementById("login").style.display = "none";
                document.getElementById("site").style.display = "block";
                document.getElementById("videoUrl").focus();
            } else {
                document.getElementById("error").textContent = "パスコードが正しくありません。";
            }
        }

        function loadVideo() {
            const input = document.getElementById("videoUrl").value.trim();
            if (!input) {
                alert("URLまたは動画IDを入力してください");
                return;
            }

            let videoId = "";

            // 各種YouTubeのURL形式から「動画ID」だけを自動で抜き出す処理
            if (input.includes("v=")) {
                videoId = input.split("v=")[1].split("&")[0];
            } else if (input.includes("youtu.be/")) {
                videoId = input.split("youtu.be/")[1].split("?")[0];
            } else if (input.includes("embed/")) {
                videoId = input.split("embed/")[1].split("?")[0];
            } else {
                // URLではなく直接ID（11文字の英数字）を入れられた場合
                videoId = input;
            }

            if (videoId) {
                // 規制を回避しやすい特殊なドメイン（youtube-nocookie.com）を使って埋め込み再生
                const embedUrl = "https://youtube-nocookie.com" + videoId;
                document.getElementById("player").src = embedUrl;
                document.getElementById("videoContainer").style.display = "block";
            } else {
                alert("正しいURLを入力してください。");
            }
        }
    </script>
</body>
</html>
