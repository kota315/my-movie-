<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Search Portal</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #333333;
            text-align: center;
            padding: 60px 15px;
        }
        /* バレないように地味な青色デザインをキープ */
        h1 {
            color: #2b579a;
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 30px;
        }
        input {
            padding: 12px 16px;
            font-size: 16px;
            width: 280px;
            max-width: 80%;
            border: 1px solid #ababab;
            border-radius: 4px;
            margin: 5px;
            outline: none;
        }
        input:focus {
            border-color: #2b579a;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: 1px solid #2b579a;
            border-radius: 4px;
            background: #2b579a;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #1e3d6b;
        }
        #site {
            display: none;
        }
        #login {
            margin-top: 100px;
        }
        #error {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- パスワード画面 -->
    <div id="login">
        <h1>🔒 認証システム</h1>
        <input type="password" id="password" placeholder="パスコードを入力" onkeydown="if(event.key === 'Enter') login()">
        <button onclick="login()">送信</button>
        <p id="error"></p>
    </div>

    <!-- ログイン後のサイト（見た目は地味なままです） -->
    <div id="site">
        <h1>🔎 Webテキスト検索ポータル</h1>
        <input type="text" id="search" placeholder="キーワードを入力" onkeydown="if(event.key === 'Enter') searchVideo()">
        <button onclick="searchVideo()">検索</button>
    </div>

    <script>
        const PASSWORD = "1234";

        function login() {
            const input = document.getElementById("password").value;
            const errorElement = document.getElementById("error");

            if (input === PASSWORD) {
                document.getElementById("login").style.display = "none";
                document.getElementById("site").style.display = "block";
                errorElement.textContent = ""; 
                document.getElementById("search").focus();
            } else {
                errorElement.textContent = "パスコードが正しくありません。";
            }
        }

        function searchVideo() {
            const keyword = document.getElementById("search").value.trim();

            if (!keyword) {
                alert("検索ワードを入力してください");
                return;
            }

            // 「udm=7」を使うことで、Googleの動画検索結果（主にYouTube動画）を
            // 新しいタブでエラーなく、安全にこっそり開きます。
            const url = "https://www.google.com/search?q=" + encodeURIComponent(keyword) + "&udm=7";
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
