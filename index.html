<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルチャット</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #7494c0; display: flex; flex-direction: column; height: 100vh; }
        
        /* ヘッダー */
        header { background-color: #1e2a38; color: white; text-align: center; padding: 15px; font-weight: bold; font-size: 1.1rem; }
        
        /* チャット表示エリア */
        #chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* メッセージの吹き出し共通 */
        .message-row { display: flex; flex-direction: column; max-width: 75%; width: max-content; }
        .sender { font-size: 0.75rem; color: #e0e0e0; margin-bottom: 3px; font-weight: bold; }
        .bubble { padding: 10px 14px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; word-break: break-all; }
        
        /* 自分（右側） */
        .my-msg { align-self: flex-end; }
        .my-msg .bubble { background-color: #7cdb7c; color: #111; border-top-right-radius: 2px; }
        .my-msg .sender { align-self: flex-end; color: #d0f0d0; }
        
        /* 相手（左側） */
        .other-msg { align-self: flex-start; }
        .other-msg .bubble { background-color: white; color: #111; border-top-left-radius: 2px; }
        
        /* 入力エリア */
        footer { background-color: #f5f5f5; padding: 10px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #ddd; }
        #name-input { width: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.9rem; }
        #message-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.9rem; outline: none; }
        #send-btn { background-color: #25d366; color: white; border: none; padding: 10px 18px; border-radius: 5px; font-size: 0.9rem; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background-color: #20ba59; }
    </style>
</head>
<body>

    <header>リアルタイム・チャットルーム</header>

    <div id="chat-area">
        <!-- ここにメッセージが追加されます -->
    </div>

    <footer>
        <input type="text" id="name-input" placeholder="名前" value="ユーザー1">
        <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
        <button id="send-btn">送信</button>
    </footer>

    <script>
        // ブラウザ間でリアルタイム通信を行うための仕組み（BroadcastChannel）
        const channel = new BroadcastChannel('chat_channel');
        
        const chatArea = document.getElementById('chat-area');
        const nameInput = document.getElementById('name-input');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // ランダムな初期ユーザー名を設定
        nameInput.value = 'ユーザー' + Math.floor(Math.random() * 100);

        // 画面にメッセージを表示する関数
        function displayMessage(name, text, isMe) {
            const messageRow = document.createElement('div');
            messageRow.classList.add('message-row', isMe ? 'my-msg' : 'other-msg');

            const sender = document.createElement('div');
            sender.classList.add('sender');
            sender.textContent = name;

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.textContent = text;

            messageRow.appendChild(sender);
            messageRow.appendChild(bubble);
            chatArea.appendChild(messageRow);

            // 常に最新のメッセージが見えるようにスクロール
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 送信ボタンを押したときの処理
        function sendMessage() {
            const name = nameInput.value.trim() || '名無し';
            const text = messageInput.value.trim();

            if (text === '') return; // 空っぽなら送信しない

            // 自分の画面に表示
            displayMessage(name, text, true);

            // 他のタブ/ウィンドウにデータを送信
            channel.postMessage({ name: name, text: text });

            // 入力欄をクリアしてフォーカスを戻す
            messageInput.value = '';
            messageInput.focus();
        }

        // クリックやエンターキーで送信
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 他のタブからメッセージを受信したときの処理
        channel.onmessage = (event) => {
            const { name, text } = event.data;
            displayMessage(name, text, false);
        };
    </script>
</body>
</html>
